<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Set new password · WareTrack</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="auth-shell">
    <div class="auth-card">
        <a href="/login" class="sidebar__brand" style="padding:0 0 var(--space-3) 0;">
            <span class="sidebar__logo">W</span>
            <span class="sidebar__brand-text">WMS<b></b></span>
        </a>
        <h1>Set new password</h1>
        <p class="page-subtitle" id="pageSubtitle">Choose a new password for your account.</p>

        <div id="banner" class="banner"></div>

        <form id="resetForm">
            <div class="field">
                <label for="password">New password</label>
                <input id="password" type="password" autocomplete="new-password" required minlength="6"/>
                <p class="helper-text">At least 6 characters.</p>
            </div>
            <div class="field">
                <label for="confirmPassword">Confirm new password</label>
                <input id="confirmPassword" type="password" autocomplete="new-password" required minlength="6"/>
            </div>
            <button type="submit" class="btn-primary" id="resetBtn" style="width:100%; justify-content:center;">Set new password</button>
        </form>

        <p class="helper-text" style="text-align:center; margin-top: var(--space-3);">
            <a href="/login">Back to sign in</a>
        </p>
    </div>
</div>

<script th:src="@{/js/api.js}"></script>
<script>
  const token = new URLSearchParams(window.location.search).get('token');
  const form = document.getElementById('resetForm');

  if (!token) {
    document.getElementById('pageSubtitle').textContent = '';
    showBanner('banner', 'This link is missing its reset token — use the link from your email.', 'error');
    form.style.display = 'none';
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    hideBanner('banner');

    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;
    if (password !== confirm) {
      showBanner('banner', "Passwords don't match.", 'error');
      return;
    }

    const btn = document.getElementById('resetBtn');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    Api.post('/api/auth/reset-password', { token: token, newPassword: password })
      .then(function () {
        window.location.href = '/login?reset=true';
      })
      .catch(function (err) {
        showBanner('banner', err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Set new password';
      });
  });
</script>
</body>
</html>
