<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Forgot password · WareTrack</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="auth-shell">
    <div class="auth-card">
        <a href="/login" class="sidebar__brand" style="padding:0 0 var(--space-3) 0;">
            <span class="sidebar__logo">W</span>
            <span class="sidebar__brand-text">WMS<b></b></span>
        </a>
        <h1>Reset password</h1>
        <p class="page-subtitle">Enter the email on your account and we'll send a reset link.</p>

        <div id="banner" class="banner"></div>

        <form id="forgotForm">
            <div class="field">
                <label for="email">Email</label>
                <input id="email" type="email" autocomplete="email" required/>
            </div>
            <button type="submit" class="btn-primary" id="forgotBtn" style="width:100%; justify-content:center;">Send reset link</button>
        </form>

        <p class="helper-text" style="text-align:center; margin-top: var(--space-3);">
            <a href="/login">Back to sign in</a>
        </p>

        <div class="seed-note">
            If SMTP isn't configured yet in <code>application.yml</code>, check the server
            console — send failures are logged there instead of breaking this page.
        </div>
    </div>
</div>

<script th:src="@{/js/api.js}"></script>
<script>
  document.getElementById('forgotForm').addEventListener('submit', function (e) {
    e.preventDefault();
    hideBanner('banner');
    const btn = document.getElementById('forgotBtn');
    btn.disabled = true;
    btn.textContent = 'Sending…';

    Api.post('/api/auth/forgot-password', { email: document.getElementById('email').value })
      .then(function () {
        // Always the same message whether or not the email exists — see
        // PasswordResetService for why that's deliberate.
        showBanner('banner', "If an account with that email exists, we've sent a reset link.", 'success');
        document.getElementById('forgotForm').reset();
      })
      .catch(function (err) {
        showBanner('banner', err.message, 'error');
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = 'Send reset link';
      });
  });
</script>
</body>
</html>
